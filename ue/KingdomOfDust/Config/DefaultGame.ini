; Mesh paths. One +Mesh line per id. Change paths here; C++ does not own them.
; kod.NewMeshes=1 tries Primary, then Fallback. kod.NewMeshes=0 uses Fallback only.
; Scale multiplies the fit (buildings) or the body scale (units). Yaw is +X forward. Z is cm.
; Anim is an optional AnimBP class path. Empty keeps the definition clips.
; Id, Primary, Fallback, optional Fallback2, Scale, Yaw, Z, Anim.
; Scale table anchored to the Marine (286 cm, SC2 marine height). kod.ScaleRef 1 draws that capsule and a 1 m grid by the HQ.
; FitMode is Height, Length, or Footprint. FitCm is the target in centimeters. Scale multiplies the fit.
; Length uses the longer horizontal side. MinHeight raises that length only when FitCm is shorter than it.
; Footprint is the build grid. Other Height rows with no FitCm use that faction worker's scale.
; Workers are about Marine-sized, like an SC2 SCV next to a 1000 cm command center.
; A path that resolves to /Engine/BasicShapes/Cube logs KodMesh Placeholder.
; +Attach hangs an extra mesh on an owner. Socket is one name or Ramp|BayRamp|Door|None.
; None is the body origin. If None is absent and no listed socket exists, the piece is skipped and logged.
; Anim, Open, Close, and IdleOpen are the ramp clips. A miss is logged and that clip is skipped.
[KodMeshes]
; Debug yaw on every building mesh. 0: art is authored diagonal. The square footprint stays at 0 degrees.
; kod.BuildingYaw overrides this live. Nonzero yaw does not shrink the fitted scale.
BuildingYawOffset=0
