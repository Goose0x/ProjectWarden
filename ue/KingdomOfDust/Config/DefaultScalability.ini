; High is the playable default. Lumen is off in DefaultEngine.ini RendererSettings
; (DynamicGlobalIlluminationMethod and ReflectionMethod are 0 / None).
; Only ECVF_Scalability cvars belong in the quality sections below.
; r.DefaultFeature.* and the Lumen method cvars ensure in commandlets.

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
sg.LandscapeQuality=3

[ShadowQuality@3]
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=1.0
r.Shadow.MaxCSMResolution=2048

[PostProcessQuality@3]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=3
r.Tonemapper.Quality=5
r.AmbientOcclusionLevels=2
r.AmbientOcclusionRadiusScale=0.5

[AntiAliasingQuality@3]
; Leave r.AntiAliasingMethod unset. Writing 4 (TSR) here makes commandlets
; apply the cvar without a renderer, hit an ensure, and exit 1.
r.ScreenPercentage=100
