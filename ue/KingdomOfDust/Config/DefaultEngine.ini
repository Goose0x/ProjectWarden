[/Script/Engine.RendererSettings]
; Lumen stays off. 0 is None for both global illumination and reflections.
; These are renderer settings, not scalability cvars. ConfigUtilities.cpp
; ensures and commandlets exit 1 if they are set from DefaultScalability.ini.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.DefaultFeature.AutoExposure=False
; RTS camera. Motion blur smears the skinned Marine even when the anim and the
; interpolated actor are stable. DefaultFeature only seeds new post-process
; settings; r.MotionBlurQuality=0 turns the feature off even if L_Slice0 already
; has blur enabled on a volume or camera.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.MotionBlurQuality=0
; Selection highlight writes custom-depth stencil 1. 3 = depth + stencil.
r.CustomDepth=3

